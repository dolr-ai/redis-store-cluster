name: Deploy Dragonfly to Bare Metal (cluster-1)

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-dragonfly-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_HOST: ${{ vars.PRIMARY_HOST_CLUSTER_1 }}
  REPLICA_HOST: ${{ vars.REPLICA_HOST_CLUSTER_1 }}

jobs:

  deploy-primary:
    name: Deploy Dragonfly Primary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set cluster variables
        id: cluster_vars
        run: |
            echo "primary_host=${PRIMARY_HOST}" >> $GITHUB_OUTPUT
            echo "replica_host=${REPLICA_HOST}" >> $GITHUB_OUTPUT
      
      - name: Display selected cluster info
        run: |
          echo "Deploying to: ${{ github.event.inputs.cluster }}"
          echo "Primary Host: ${{ steps.cluster_vars.outputs.primary_host }}"
          echo "Target: ${{ github.event.inputs.target }}"

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_BARE_METAL_GITHUB_ACTIONS_SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ steps.cluster_vars.outputs.primary_host }} >> ~/.ssh/known_hosts
      - name: Check server connectivity
        run: |
          ssh -o ConnectTimeout=10 root@${{ steps.cluster_vars.outputs.primary_host }} "echo 'Server connection successful'"

      - name: Generate TLS Certificates
        id: generate-certs
        run: |
          mkdir -p certs
          
          # Create SAN config using the Workflow Variables
          # We include both Primary and Replica IPs so the cert is valid for both
          SAN_CNF=$(mktemp)
          echo "subjectAltName = IP:${{ steps.cluster_vars.outputs.primary_host }},IP:${{ steps.cluster_vars.outputs.replica_host }}" > "$SAN_CNF"
          
          echo "Generating CA..."
          openssl genrsa -out certs/ca.key 4096
          openssl req -x509 -new -nodes -key certs/ca.key -sha256 -days 365 \
            -subj "/CN=dragonfly-internal-ca" -out certs/ca.crt

          echo "Generating Server Cert..."
          openssl req -new -newkey rsa:4096 -nodes \
            -keyout certs/server.key \
            -out certs/server.csr \
            -subj "/CN=dragonfly-node"
          
          openssl x509 -req -in certs/server.csr \
            -CA certs/ca.crt -CAkey certs/ca.key -CAcreateserial \
            -out certs/server.crt -days 365 -sha256 -extfile "$SAN_CNF"
          
          # Create PEM (Combined) if needed by HAProxy, but keep individual files for Dragonfly
          cat certs/server.crt certs/server.key > certs/server.pem

          echo "Generating Client Cert..."
          openssl req -new -newkey rsa:4096 -nodes \
            -keyout certs/client.key \
            -out certs/client.csr \
            -subj "/CN=redis-client"
            
          openssl x509 -req -in certs/client.csr \
            -CA certs/ca.crt -CAkey certs/ca.key -CAcreateserial \
            -out certs/client.crt -days 365 -sha256

          # Cleanup
          rm -f "$SAN_CNF"
          ls -l certs/

      - name: Upload Certs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragonfly-certs
          path: certs/
          retention-days: 1

      - name: Sync deployment files to server
        run: |
          # 1. Sync docker-compose.primary.yml to remote server
          rsync -avz --delete \
            ./deploy/docker-compose.primary.yml \
            root@${{ steps.cluster_vars.outputs.primary_host }}:/home/dragonfly/

          # 2. Sync HAProxy config to /home/dragonfly/haproxy/
          ssh root@${{ steps.cluster_vars.outputs.primary_host }} " rm -rf /home/dragonfly/haproxy/haproxy.cfg && mkdir -p /home/dragonfly/haproxy"
          rsync -avz \
            ./haproxy/haproxy.cfg \
            root@${{ steps.cluster_vars.outputs.primary_host }}:/home/dragonfly/haproxy/haproxy.cfg

          # 3. Sync certs to /home/dragonfly/certs/
          ssh root@${{ steps.cluster_vars.outputs.primary_host }} "rm -rf /home/dragonfly/certs && mkdir -p /home/dragonfly/certs"
          rsync -avz \
            ./certs/ \
            root@${{ steps.cluster_vars.outputs.primary_host }}:/home/dragonfly/certs/

      - name: Create .env file on primary server
        run: |
          ssh root@${{ steps.cluster_vars.outputs.primary_host }} \
            "echo 'DRAGONFLY_PASSWORD=${{ secrets.DRAGONFLY_PASSWORD_CLUSTER_1 }}' > /home/dragonfly/.env"
      
      - name: Deploy Dragonfly Primary
        env:
          DRAGONFLY_PASSWORD : ${{ secrets.DRAGONFLY_PASSWORD_CLUSTER_1 }}
        run: |
          ssh root@${{ steps.cluster_vars.outputs.primary_host }} << 'EOF'
            cd /home/dragonfly
            
            # Pull latest image
            docker compose -f docker-compose.primary.yml pull
            
            # Deploy with zero downtime
            docker compose -f docker-compose.primary.yml up -d --remove-orphans

            # Wait for health check
            echo "Waiting for Dragonfly to be healthy..."
            timeout 60 sh -c 'until docker compose -f docker-compose.primary.yml ps | grep -q "healthy"; do sleep 2; done'
            
            # Show status
            docker compose -f docker-compose.primary.yml ps
            docker compose -f docker-compose.primary.yml logs --tail=50
          EOF

      - name: Verify primary deployment
        run: |
          ssh root@${{ steps.cluster_vars.outputs.primary_host }} \
            "docker exec dragonfly redis-cli -a ${{ secrets.DRAGONFLY_PASSWORD }} ping"

  deploy-replica:
    name: Deploy Dragonfly Replica
    runs-on: ubuntu-latest
    needs: deploy-primary
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set cluster variables
        id: cluster_vars
        run: |
            echo "primary_host=${PRIMARY_HOST}" >> $GITHUB_OUTPUT
            echo "replica_host=${REPLICA_HOST}" >> $GITHUB_OUTPUT

      - name: Download Certs Artifact
        uses: actions/download-artifact@v4
        with:
          name: dragonfly-certs
          path: certs

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_BARE_METAL_GITHUB_ACTIONS_SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ steps.cluster_vars.outputs.replica_host }} >> ~/.ssh/known_hosts
      - name: Check server connectivity
        run: |
          ssh -o ConnectTimeout=10 root@${{ steps.cluster_vars.outputs.replica_host }} "echo 'Server connection successful'"

      - name: Sync deployment files to server
        run: |
          # 1. Sync docker-compose.replica.yml to remote server
          rsync -avz --delete \
            ./deploy/docker-compose.replica.yml \
            root@${{ steps.cluster_vars.outputs.replica_host }}:/home/dragonfly/

          # 2. Sync HAProxy config to /home/dragonfly/haproxy/
          ssh root@${{ steps.cluster_vars.outputs.replica_host }} "rm -rf /home/dragonfly/haproxy/haproxy.cfg &&mkdir -p /home/dragonfly/haproxy"
          rsync -avz \
            ./haproxy/haproxy.cfg \
            root@${{ steps.cluster_vars.outputs.replica_host }}:/home/dragonfly/haproxy/haproxy.cfg

          # 3. Sync certs to /home/dragonfly/certs/
          ssh root@${{ steps.cluster_vars.outputs.replica_host }} "rm -rf /home/dragonfly/certs && mkdir -p /home/dragonfly/certs"
          rsync -avz \
            ./certs/ \
            root@${{ steps.cluster_vars.outputs.replica_host }}:/home/dragonfly/certs/

      - name: Create .env file on replica server
        run: |
          ssh root@${{ steps.cluster_vars.outputs.replica_host }} "cat > /home/dragonfly/.env <<EOF
          DRAGONFLY_PASSWORD=${{ secrets.DRAGONFLY_PASSWORD_CLUSTER_1 }}
          PRIMARY_HOST=${{ steps.cluster_vars.outputs.primary_host }}
          EOF"

      - name: Deploy Dragonfly Replica
        env:
            DRAGONFLY_PASSWORD : ${{ secrets.DRAGONFLY_PASSWORD_CLUSTER_1 }}
            PRIMARY_HOST: ${{ steps.cluster_vars.outputs.primary_host }}
        run: |
          ssh root@${{ steps.cluster_vars.outputs.replica_host }} << 'EOF'
            cd /home/dragonfly
            
            # Pull latest image
            docker compose -f docker-compose.replica.yml pull
            
            # Deploy
            docker compose -f docker-compose.replica.yml up -d --remove-orphans

            # Wait for health check
            echo "Waiting for Dragonfly to be healthy..."
            timeout 60 sh -c 'until docker compose -f docker-compose.replica.yml ps | grep -q "healthy"; do sleep 2; done'
            
            # Show status
            docker compose -f docker-compose.replica.yml ps
            docker compose -f docker-compose.replica.yml logs --tail=50
          EOF

      - name: Verify replica deployment
        run: |
          ssh root@${{ steps.cluster_vars.outputs.replica_host }} \
            "docker exec dragonfly redis-cli -a ${{ secrets.DRAGONFLY_PASSWORD_CLUSTER_1 }} ping"

      - name: Check replication status
        run: |
          ssh root@${{ steps.cluster_vars.outputs.replica_host }} \
            "docker exec dragonfly redis-cli -a ${{ secrets.DRAGONFLY_PASSWORD_CLUSTER_1 }} INFO replication"


  health-check:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: [deploy-primary, deploy-replica]
    if: always() && (needs.deploy-primary.result == 'success' || needs.deploy-replica.result == 'success')

    steps:
      - name: Set cluster variables
        id: cluster_vars
        run: |
            echo "primary_host=${PRIMARY_HOST}" >> $GITHUB_OUTPUT
            echo "replica_host=${REPLICA_HOST}" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_BARE_METAL_GITHUB_ACTIONS_SSH_PRIVATE_KEY }}

      - name: Add servers to known hosts
        run: |
          ssh-keyscan -H ${{ steps.cluster_vars.outputs.primary_host }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ steps.cluster_vars.outputs.replica_host }} >> ~/.ssh/known_hosts

      - name: Check primary health
        if: needs.deploy-primary.result == 'success'
        run: |
          echo "=== Primary Health Check (${{ github.event.inputs.cluster }}) ==="
          echo "Host: ${{ steps.cluster_vars.outputs.primary_host }}"
          ssh root@${{ steps.cluster_vars.outputs.primary_host }} << 'EOF'
            docker exec dragonfly redis-cli -a ${{ secrets.DRAGONFLY_PASSWORD_CLUSTER_1 }} --no-auth-warning INFO server | grep uptime_in_seconds
            docker exec dragonfly redis-cli -a ${{ secrets.DRAGONFLY_PASSWORD_CLUSTER_1 }} --no-auth-warning DBSIZE
          EOF

      - name: Check replica health
        if: needs.deploy-replica.result == 'success'
        run: |
          echo "=== Replica Health Check (${{ github.event.inputs.cluster }}) ==="
          echo "Host: ${{ steps.cluster_vars.outputs.replica_host }}"
          ssh root@${{ steps.cluster_vars.outputs.replica_host }} << 'EOF'
            docker exec dragonfly redis-cli -a ${{ secrets.DRAGONFLY_PASSWORD_CLUSTER_1 }} --no-auth-warning INFO server | grep uptime_in_seconds
            docker exec dragonfly redis-cli -a ${{ secrets.DRAGONFLY_PASSWORD_CLUSTER_1 }} --no-auth-warning INFO replication | grep -E "role|master_host|master_link_status"
            docker exec dragonfly redis-cli -a ${{ secrets.DRAGONFLY_PASSWORD_CLUSTER_1 }} --no-auth-warning DBSIZE
          EOF

      - name: Deployment Summary
        if: success()
        run: |
          echo "================================"
          echo "Deployment Successful"
          echo "================================"
          echo ""
          echo "Cluster: ${{ github.event.inputs.cluster }}"
          echo "Primary Status: ${{ needs.deploy-primary.result }}"
          echo "Replica Status: ${{ needs.deploy-replica.result }}"
          echo ""