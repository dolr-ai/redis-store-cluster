name: Deploy Dragonfly to Bare Metal

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-dragonfly-${{ github.ref }}
  cancel-in-progress: false

env:
  MASTER_HOST: ${{ vars.MASTER_HOST_CLUSTER_1 }}
  REPLICA_HOST: ${{ vars.REPLICA_HOST_CLUSTER_1 }}

jobs:

  deploy-master:
    name: Deploy Dragonfly Master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set cluster variables
        id: cluster_vars
        run: |
            echo "master_host=${MASTER_HOST}" >> $GITHUB_OUTPUT
            echo "replica_host=${REPLICA_HOST}" >> $GITHUB_OUTPUT
      
      - name: Display selected cluster info
        run: |
          echo "Deploying to: ${{ github.event.inputs.cluster }}"
          echo "Master Host: ${{ steps.cluster_vars.outputs.master_host }}"
          echo "Target: ${{ github.event.inputs.target }}"

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_BARE_METAL_GITHUB_ACTIONS_SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ steps.cluster_vars.outputs.master_host }} >> ~/.ssh/known_hosts
      - name: Check server connectivity
        run: |
          ssh -o ConnectTimeout=10 root@${{ steps.cluster_vars.outputs.master_host }} "echo 'Server connection successful'"

      - name: Sync deployment files to server
        run: |
          rsync -avz --delete \
            ./deploy/docker-compose.master.yml \
            root@${{ steps.cluster_vars.outputs.master_host }}:/home/dragonfly/

      - name: Create .env file on master server
        run: |
          ssh root@${{ steps.cluster_vars.outputs.master_host }} \
            "echo 'DRAGONFLY_PASSWORD=${{ secrets.DRAGONFLY_ROOT_PASSWORD }}' > /home/dragonfly/.env"

      - name: Deploy Dragonfly Master
        env:
          DRAGONFLY_PASSWORD : ${{ secrets.DRAGONFLY_ROOT_PASSWORD }}
        run: |
          ssh root@${{ steps.cluster_vars.outputs.master_host }} << 'EOF'
            cd /home/dragonfly
            
            # Pull latest image
            docker compose -f docker-compose.master.yml pull
            
            # Deploy with zero downtime
            docker compose -f docker-compose.master.yml up -d --remove-orphans

            # Wait for health check
            echo "Waiting for Dragonfly to be healthy..."
            timeout 60 sh -c 'until docker compose -f docker-compose.master.yml ps | grep -q "healthy"; do sleep 2; done'
            
            # Show status
            docker compose -f docker-compose.master.yml ps
            docker compose -f docker-compose.master.yml logs --tail=50
          EOF

      - name: Verify master deployment
        run: |
          ssh root@${{ steps.cluster_vars.outputs.master_host }} \
            "docker exec dragonfly redis-cli -a ${{ secrets.DRAGONFLY_PASSWORD }} ping"

  deploy-replica:
    name: Deploy Dragonfly Replica
    runs-on: ubuntu-latest
    needs: deploy-master
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set cluster variables
        id: cluster_vars
        run: |
            echo "master_host=${MASTER_HOST}" >> $GITHUB_OUTPUT
            echo "replica_host=${REPLICA_HOST}" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_BARE_METAL_GITHUB_ACTIONS_SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ steps.cluster_vars.outputs.replica_host }} >> ~/.ssh/known_hosts
      - name: Check server connectivity
        run: |
          ssh -o ConnectTimeout=10 root@${{ steps.cluster_vars.outputs.replica_host }} "echo 'Server connection successful'"

      - name: Sync deployment files to server
        run: |
          rsync -avz --delete \
            ./deploy/docker-compose.replica.yml \
            root@${{ steps.cluster_vars.outputs.replica_host }}:/home/dragonfly/

      - name: Create .env file on replica server
        run: |
          ssh root@${{ steps.cluster_vars.outputs.replica_host }} "cat > /home/dragonfly/.env <<EOF
          DRAGONFLY_PASSWORD=${{ secrets.DRAGONFLY_ROOT_PASSWORD }}
          MASTER_HOST=${{ steps.cluster_vars.outputs.master_host }}
          EOF"

      - name: Deploy Dragonfly Replica
        env:
            DRAGONFLY_PASSWORD : ${{ secrets.DRAGONFLY_ROOT_PASSWORD }}
            MASTER_HOST: ${{ steps.cluster_vars.outputs.master_host }}
        run: |
          ssh root@${{ steps.cluster_vars.outputs.replica_host }} << 'EOF'
            cd /home/dragonfly
            
            # Pull latest image
            docker compose -f docker-compose.replica.yml pull
            
            # Deploy
            docker compose -f docker-compose.replica.yml up -d --remove-orphans

            # Wait for health check
            echo "Waiting for Dragonfly to be healthy..."
            timeout 60 sh -c 'until docker compose -f docker-compose.replica.yml ps | grep -q "healthy"; do sleep 2; done'
            
            # Show status
            docker compose -f docker-compose.replica.yml ps
            docker compose -f docker-compose.replica.yml logs --tail=50
          EOF

      - name: Verify replica deployment
        run: |
          ssh root@${{ steps.cluster_vars.outputs.replica_host }} \
            "docker exec dragonfly redis-cli -a ${{ secrets.DRAGONFLY_ROOT_PASSWORD }} ping"

      - name: Check replication status
        run: |
          ssh root@${{ steps.cluster_vars.outputs.replica_host }} \
            "docker exec dragonfly redis-cli -a ${{ secrets.DRAGONFLY_ROOT_PASSWORD }} INFO replication"


  health-check:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: [deploy-master, deploy-replica]
    if: always() && (needs.deploy-master.result == 'success' || needs.deploy-replica.result == 'success')
    
    steps:
      - name: Set cluster variables
        id: cluster_vars
        run: |
            echo "master_host=${MASTER_HOST}" >> $GITHUB_OUTPUT
            echo "replica_host=${REPLICA_HOST}" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_BARE_METAL_GITHUB_ACTIONS_SSH_PRIVATE_KEY }}

      - name: Add servers to known hosts
        run: |
          ssh-keyscan -H ${{ steps.cluster_vars.outputs.master_host }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ steps.cluster_vars.outputs.replica_host }} >> ~/.ssh/known_hosts

      - name: Check master health
        if: needs.deploy-master.result == 'success'
        run: |
          echo "=== Master Health Check (${{ github.event.inputs.cluster }}) ==="
          echo "Host: ${{ steps.cluster_vars.outputs.master_host }}"
          ssh root@${{ steps.cluster_vars.outputs.master_host }} << 'EOF'
            docker exec dragonfly-master redis-cli -a ${{ secrets.DRAGONFLY_ROOT_PASSWORD }} --no-auth-warning INFO server | grep uptime_in_seconds
            docker exec dragonfly-master redis-cli -a ${{ secrets.DRAGONFLY_ROOT_PASSWORD }} --no-auth-warning DBSIZE
          EOF

      - name: Check replica health
        if: needs.deploy-replica.result == 'success'
        run: |
          echo "=== Replica Health Check (${{ github.event.inputs.cluster }}) ==="
          echo "Host: ${{ steps.cluster_vars.outputs.replica_host }}"
          ssh root@${{ steps.cluster_vars.outputs.replica_host }} << 'EOF'
            docker exec dragonfly-replica redis-cli -a ${{ secrets.DRAGONFLY_ROOT_PASSWORD }} --no-auth-warning INFO server | grep uptime_in_seconds
            docker exec dragonfly-replica redis-cli -a ${{ secrets.DRAGONFLY_ROOT_PASSWORD }} --no-auth-warning INFO replication | grep -E "role|master_host|master_link_status"
            docker exec dragonfly-replica redis-cli -a ${{ secrets.DRAGONFLY_ROOT_PASSWORD }} --no-auth-warning DBSIZE
          EOF

      - name: Deployment Summary
        if: success()
        run: |
          echo "================================"
          echo "Deployment Successful"
          echo "================================"
          echo ""
          echo "Cluster: ${{ github.event.inputs.cluster }}"
          echo "Master Status: ${{ needs.deploy-master.result }}"
          echo "Replica Status: ${{ needs.deploy-replica.result }}"
          echo ""