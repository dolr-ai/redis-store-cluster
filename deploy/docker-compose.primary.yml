version: '3.8'

x-logging: &default-logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  dragonfly-primary:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.34.2
    container_name: dragonfly-primary
    ports:
      - "6379:6379"
    command:
      - --requirepass=${DRAGONFLY_PASSWORD}
      - --bind=0.0.0.0
      - --port=6379
      - --dir=/data
      - --dbfilename=dump
      - --snapshot_cron=0 */6 * * *  # Snapshot every 6 hours
      - --cache_mode=true
      - --proactor_threads=8
      - --primary_port_http_enabled=true
      - --logtostderr
      - --vmodule=*=1  # 0=ERROR, 1=WARNING, 2=INFO, 3=DEBUG
      - --tls=false  # Nginx handles TLS
    environment:
      - DRAGONFLY_PASSWORD=${DRAGONFLY_PASSWORD}
    volumes:
      - dragonfly_data:/data
    networks:
      - dragonfly_network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DRAGONFLY_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ulimits:
      memlock: -1

  # nginx:
  #   image: nginx:alpine
  #   container_name: dragonfly-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "6379:6379"  # Redis/Dragonfly with TLS
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     dragonfly:
  #       condition: service_healthy
  #   restart: always
