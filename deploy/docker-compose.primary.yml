version: '3.8'

x-logging: &default-logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  # Primary Dragonfly service
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.34.2
    container_name: dragonfly
    ports:
      - "6380:6380"
    command:
      - --requirepass=${DRAGONFLY_PASSWORD}
      - --bind=0.0.0.0
      - --port=6380
      - --dir=/data
      - --dbfilename=dump
      - --snapshot_cron=0 */6 * * *  # Snapshot every 6 hours
      - --cache_mode=true
      - --proactor_threads=8
      - --primary_port_http_enabled=true
      - --logtostderr
      - --vmodule=*=1  # 0=ERROR, 1=WARNING, 2=INFO, 3=DEBUG
      - --tls=true
      - --tls_cert_file=/etc/dragonfly/certs/server.crt
      - --tls_key_file=/etc/dragonfly/certs/server.key
      - --tls_ca_cert_file=/etc/dragonfly/certs/ca.crt
      - --tls_client_cert_optional=false
    environment:
      - DRAGONFLY_PASSWORD=${DRAGONFLY_PASSWORD}
    volumes:
      - dragonfly_data:/data
      - ./certs:/etc/dragonfly/certs:ro
    networks:
      - dragonfly_network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DRAGONFLY_PASSWORD}", "--tls", "--cert", "/etc/dragonfly/certs/client.crt", "--key", "/etc/dragonfly/certs/client.key", "--cacert", "/etc/dragonfly/certs/ca.crt", "-p", "6380", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ulimits:
      memlock: -1

volumes:
  dragonfly_data:
      driver: local

networks:
  dragonfly_network:
    driver: bridge