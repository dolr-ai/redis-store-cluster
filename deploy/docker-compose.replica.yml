version: '3.8'

x-logging: &default-logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:

  dragonfly-replica:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.34.2
    container_name: dragonfly
    ports:
      - "6379:6379"
    command:
      - --requirepass=${DRAGONFLY_ROOT_PASSWORD}
      - --masterauth=${DRAGONFLY_PASSWORD}
      - --replicaof=${MASTER_IP}:6379
      - --bind=0.0.0.0
      - --port=6379
      - --dir=/data
      - --dbfilename=dump
      - --snapshot_cron=0 */6 * * *  # Snapshot every 6 hours
      - --cache_mode=true
      - --maxmemory=50gb
      - --proactor_threads=8
      - --primary_port_http_enabled=true
      - --logtostderr
      - --vmodule=*=1  # 0=ERROR, 1=WARNING, 2=INFO, 3=DEBUG
      - --tls=false  # Nginx handles TLS
    environment:
      - DRAGONFLY_PASSWORD=${{ secrets.DRAGONGLY_ROOT_PASSWORD }}
      - MASTER_IP=${MASTER_IP}
    networks:
      - dragonfly_network
    volumes:
      - dragonfly-data:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DRAGONFLY_ROOT_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 55gb
        reservations:
          memory: 50gb

  nginx:
    image: nginx:alpine
    container_name: dragonfly-nginx
    ports:
      - "80:80"
      - "443:443"
      - "6379:6379"  # Redis/Dragonfly with TLS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      dragonfly:
        condition: service_healthy
    restart: always
    logging: *default-logging

volumes:
  dragonfly_data:
      driver: local

networks:
  dragonfly_network:
    driver: bridge
