version: '3.8'

x-logging: &default-logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:

  dragonfly-replica:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.34.2
    container_name: dragonfly-replica
    command:
      - --requirepass=${DRAGONFLY_PASSWORD}
      - --masterauth=${DRAGONFLY_PASSWORD}
      - --replicaof=${PRIMARY_HOST}:6379
      - --bind=0.0.0.0
      - --port=6379
      - --dir=/data
      - --dbfilename=dump
      - --snapshot_cron=0 */6 * * *  # Snapshot every 6 hours
      - --cache_mode=true
      - --proactor_threads=8
      - --primary_port_http_enabled=true
      - --logtostderr
      - --vmodule=*=1  # 0=ERROR, 1=WARNING, 2=INFO, 3=DEBUG
      - --tls=false  # HAProxy handles TLS
    environment:
      - DRAGONFLY_PASSWORD=${DRAGONFLY_PASSWORD}
      - PRIMARY_HOST=${PRIMARY_HOST}
    volumes:
      - dragonfly_data:/data
    networks:
      - dragonfly_network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DRAGONFLY_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ulimits:
      memlock: -1

  haproxy:
    image: haproxy:2.8-alpine
    container_name: dragonfly-haproxy
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs/server.pem:/etc/haproxy/server.pem:ro
      - ./certs/ca.crt:/etc/haproxy/ca.crt:ro
    depends_on:
      dragonfly-replica:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD", "pgrep", "haproxy"]
      interval: 30s
      timeout: 10s
      retries: 3


volumes:
  dragonfly_data:
      driver: local

networks:
  dragonfly_network:
    driver: bridge
